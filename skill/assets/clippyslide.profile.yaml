# ========================================================================
# Clippyflow Profile - v1.0
# Authoring contract for the Clippyflow theme -- the ClippySlide brand-flagship
# look. Consumed by the `/clippyflow-design` Clawpilot skill. This is the
# human/agent-facing source of truth: what the theme is, the rules, the QA.
# Clippyflow is the default ClippySlide theme; legacy CoE assets remain available separately.
# ========================================================================
apiVersion: clippyflow/v1
kind: DesignProfile
metadata:
  name: Clippyflow
  version: 1.0.0
  source: Clippyflow Theme #18 (ClippyClaw theme registry)
  extends: ClippySlide dark system
  authors: [dayour]

principles:
  - Deep-navy SPECTRUM canvas -- magenta top-left, cyan center, green bottom-right
    over a deep-navy gradient. Never a flat black or flat grey.
  - Surfaces are translucent deep navy so the spectrum sweep peeks through.
  - The full logo spectrum (cyan/blue/purple/magenta/green) carries meaning &
    data; ONE electric nitrous-blue (214deg) carries STRUCTURE.
  - Nitrous = thin rims, focus rings, scrollbars, dividers, section underlines.
    It is never a chart/data hue.
  - Brand-action / CTA fill is cyan (186deg), not nitrous.
  - Titles are spectrum-gradient and bold; section sub-heads get the nitrous underline.
  - Zero emoji. High contrast (AA). Premium, dark, restrained.

spectrum:        # mode-invariant logo hues
  cyan:    "hsl(186,100%,45%)"   # fills
  cyanBr:  "hsl(186,100%,58%)"   # CTA / brand-action
  blue:    "hsl(206,100%,42%)"   # links
  purple:  "hsl(257,100%,62%)"   # primary
  magenta: "hsl(291,100%,58%)"   # danger / accent
  green:   "hsl(142,71%,40%)"    # success
  orange:  "hsl(28,100%,55%)"    # warning / chart-5 (NOT a brand hue)

nitrous:         # THE structural accent -- 214deg, between cyan and blue
  base:       "hsl(214,100%,58%)"
  strong:     "hsl(214,100%,64%)"     # hover/focus
  glow:       "hsla(214,100%,60%,.40)" # active-card halo
  rim:        "hsla(214,100%,60%,.55)" # solid-feeling thin outline
  tint:       "hsla(214,100%,60%,.28)" # subtle border/separator
  thumb:      "hsla(214,100%,64%,.32)" # scrollbar rest
  thumbHover: "hsla(214,100%,64%,.50)" # scrollbar hover

surfaces:
  navy:     "hsl(200,16%,8%)"
  navyDeep: "hsl(206,30%,5%)"
  card:     "hsla(200,16%,12%,.94)"   # translucent
  tile:     "hsla(200,18%,16%,.92)"

gradients:
  spectrum: "linear 100deg cyan -> nitrous@26% -> purple@60% -> magenta"
  title:    "linear 92deg  cyan64 -> nitrous70@32% -> purple76@64% -> magenta72"
  action:   "linear 135deg cyanBr -> blue   (CTA fill; never nitrous)"
  health:   "linear 90deg  magenta -> purple -> nitrous -> cyan -> green"
  appBg:    "radial magenta(TL) + cyan(center) + green(BR) over linear navyDeep->navy"

charts:   # full brand spectrum, NO nitrous
  chart1: cyan
  chart2: green
  chart3: magenta
  chart4: purple
  chart5: orange

geometry: { radius: 16px, radiusSmall: 10px, rim: 1.5px, pad: 20px }
type:
  family: "Segoe UI Variable, Segoe UI, system-ui, sans-serif"
  mono:   "Cascadia Code, Consolas, monospace"
  scale:  { title: 46, kicker: 30, h2: 22, label: 17, body: 16, mono: 14 }
  titleWeight: 800

components:   # css class -> purpose  (prefix cf-)
  cf-stage:          Canvas 1280x720, deep-navy spectrum background.
  "cf-stage--hero":  Stronger 4-stop spectrum bloom for title/hero slides.
  cf-panel:          Translucent navy surface + thin nitrous rim that glows.
  "cf-panel.spectrum": Spectrum gradient-border hero panel.
  "cf-panel.solid":  Opaque inner surface for diagram slides.
  cf-accent-left:    Spectrum accent bar bleeding off the left edge.
  cf-title:          Spectrum-gradient bold display title.
  cf-kicker:         Spectrum-gradient uppercase kicker.
  "cf-h2.under":     Nitrous-underlined section sub-header.
  "cf-pill.cyan/.purple/.magenta/.nitrous": Diagram pills (topic/agent/etc).
  cf-tile:           Knowledge/tools tile (navy + nitrous tint border).
  cf-orx:            Vertical Orchestrator rail label (nitrous left border).
  cf-divider:        Nitrous rule divider with end dots.
  cf-swatch:         Spectrum/nitrous color swatch for token boards.
  cf-chip:           Nitrous-tint pill chip.
  cf-badge:          Status/identity badge with nitrous dot.
  cf-agentcard:      Connected-agent card (icon + label).
  "cf-env.dev/.sandbox/.prod": Lifecycle env cards (magenta/nitrous/green spine).
  cf-health:         Bottom brand-spectrum health/progress bar.
  cf-scroll:         Nitrous custom scrollbar for scroll regions.
  cf-focusable:      Nitrous focus-visible ring.

archetypes:
  title:               { layout: hero spectrum bloom + watermark + kicker/title }
  spectrumBoard:       { layout: swatch row + nitrous-rule explainer + chips + health bar }
  orchestratorDiagram: { layout: solid inner panel + pills + tiles + orchestrator rail + connected-agent column }
  contentPanel:        { layout: spectrum title + body panels }
  lifecycleHealthBar:  { layout: env card columns + brand-spectrum health bar }

qa:   # every Clippyflow artifact must pass this checklist
  - Background shows the deep-navy SPECTRUM (magenta TL / cyan center / green BR),
    not flat black or grey.
  - Surfaces are translucent -- the spectrum peeks through behind cards.
  - Nitrous rims/dividers/underlines read clearly against the navy (the #1 failure
    mode is low-contrast dark-on-dark -- verify the rim is actually visible).
  - Nitrous appears ONLY as structure; it is absent from any chart/data fill.
  - CTA / brand-action fills are cyan, not nitrous.
  - Title uses the spectrum gradient; no underline on display titles.
  - Charts use cyan/green/magenta/purple/orange (no nitrous).
  - Contrast AA on all text. Zero emoji anywhere.
  - No raw hex literals in slide markup for brand colors -- only cf- classes / tokens.

commands:   # the /clippyflow-design skill surface
  - new:       Scaffold a Clippyflow deck from an archetype.
  - add-slide: Add a slide of a given archetype (cf- components only).
  - theme:     Retune the palette -- change nitrous or a spectrum hue in ONE place
               (clippyflow.css :root) and the whole system cascades.
  - render:    HTML -> PNG via Edge headless (isolated profile, absolute path).
  - validate:  Run this qa checklist + a fresh-eyes visual sub-agent pass.
  - export:    Deck -> standalone HTML.
  - present:   Presenter mode (cf-scroll nitrous scrollbar; full-bleed slides).
  - compare:   Render the same slide with the legacy CoE assets and Clippyflow side by side.
