<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>TileSlide — Title</title>
<link rel="stylesheet" href="../clippyslide.css">
<style>
  html,body{margin:0;background:#000;}
  .wm{position:absolute;left:90px;top:120px;width:680px;height:560px;opacity:.16;
      filter:blur(.3px);pointer-events:none;}
  .block{position:absolute;left:360px;top:236px;}
  .block .cs-kicker{margin-bottom:96px;}
  .block .sub{font-weight:700;font-size:42px;color:var(--cs-cyan);line-height:1.12;}

<body>
  <div class="cs-stage cs-stage--title">
    <!-- abstract watermark placeholder (customer logo sits here in the source deck) -->

      <path d="M100 18 C150 40 168 96 150 150 C132 188 68 188 50 150 C32 96 50 40 100 18 Z"/>
      <path d="M100 40 C60 70 60 130 100 168 C140 130 140 70 100 40 Z"/>
      <path d="M62 96 C82 86 118 86 138 96"/>
      <path d="M58 124 C82 112 118 112 142 124"/>
    </svg>
    <div class="block">
      <div class="cs-kicker">COPILOT AGENT DEVELOPMENT</div>
      <div class="sub">Oceaneering</div>

    </div>
  </div>
</body></html>
