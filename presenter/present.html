<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClippyFlow -- ClippySlide</title>
<style>
  :root{
    --cyan:#00CFE6; --nitrous:#2986FF; --mag:#DF29FF; --purple:#7B3DFF;
    --white:#EAF2FB; --muted:rgba(234,242,251,.58);
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --grad-title:linear-gradient(92deg,#47F0FF,#66A3FF 32%,#B28CFF 64%,#E970FF);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;}

  /* -- Layer 1 - presentation (full-bleed reproduction, top-anchored, scaled) -- */
  #viewport{position:fixed;inset:0;background:#000;overflow:hidden;}
  #frameWrap{position:absolute;left:50%;top:0;width:1280px;height:720px;
    transform:translateX(-50%) scale(var(--s,1));transform-origin:top center;
    background:#000;}
  #slideFrame{width:1280px;height:720px;border:0;display:block;background:#000;}

  /* invisible edge click-zones for prev/next */
  .navzone{position:fixed;top:34px;bottom:0;width:12%;z-index:600;cursor:pointer;background:transparent;border:0;outline:0;}
  .navzone.left{left:0;} .navzone.right{right:0;}

  /* -- Layer 2 - viewport-grid measurement border (toggle: G) -- */
  #measure{position:absolute;left:50%;top:0;width:1280px;height:720px;
    transform:translateX(-50%) scale(var(--s,1));transform-origin:top center;
    z-index:680;pointer-events:none;display:none;}
  body.measure #measure{display:block;}
  #measure .edge{position:absolute;background:rgba(57,176,255,.55);}
  #measure .edge.t{top:0;left:0;right:0;height:1px;}
  #measure .edge.b{bottom:0;left:0;right:0;height:1px;}
  #measure .edge.l{top:0;bottom:0;left:0;width:1px;}
  #measure .edge.r{top:0;bottom:0;right:0;width:1px;}
  #measure .tick{position:absolute;background:rgba(202,91,205,.7);}
  #measure .tick.cx{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px);}
  #measure .tick.cy{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px);}
  #measure .dim{position:absolute;font-family:var(--mono);font-size:11px;color:#9eeaff;
    background:rgba(3,5,18,.8);border:1px solid rgba(57,176,255,.4);padding:2px 6px;border-radius:5px;}
  #measure .dim.stage{left:6px;top:6px;}
  #measure .dim.safe{right:6px;bottom:30px;color:#9fffc6;border-color:rgba(34,197,94,.4);}

  /* -- Layer 3 - floating header tilebar (recedes; hover/idle controlled) -- */
  .floating-header{
    position:fixed;top:0;left:0;right:0;height:34px;z-index:700;
    display:flex;align-items:center;gap:8px;padding:0 12px;
    background:linear-gradient(180deg,rgba(9,16,24,.84) 0%,rgba(9,16,24,.34) 64%,transparent 100%);
    opacity:.42;transition:opacity .4s ease;}
  .floating-header:hover{opacity:1;}
  .floating-header.hidden{opacity:0;pointer-events:none;}
  .brand{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9;}
  .page-title{font-size:12px;font-weight:600;color:var(--muted);margin-right:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw;}
  .header-stat{font-family:var(--mono);font-size:10.5px;color:var(--muted);
    padding:2px 7px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.03);}
  .header-btn{height:23px;padding:0 8px;font-size:11px;font-weight:600;color:var(--muted);
    background:transparent;border:1px solid rgba(255,255,255,.10);border-radius:7px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:color .15s,border-color .15s,background .15s;}
  .header-btn:hover{color:#fff;border-color:rgba(255,255,255,.30);background:rgba(255,255,255,.06);}
  .header-btn:disabled{opacity:.3;cursor:not-allowed;}
  .header-sep{width:1px;height:16px;background:rgba(255,255,255,.10);}

  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:650;
    font-size:11px;color:var(--muted);font-family:var(--mono);
    background:rgba(9,16,24,.58);border:1px solid rgba(41,134,255,.18);
    padding:4px 11px;border-radius:999px;transition:opacity .5s ease;}

  /* ── Layer 4 · deck library overlay (L) ── */
  #library{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;
    padding:32px;background:rgba(5,10,16,.78);backdrop-filter:blur(6px);}
  #library[hidden]{display:none;}
  .lib-panel{width:min(1000px,100%);max-height:100%;overflow:auto;background:#0b131d;
    border:1px solid rgba(41,134,255,.22);border-radius:16px;padding:24px 26px 20px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .lib-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .lib-sub{margin-right:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .lib-card{display:flex;flex-direction:column;gap:7px;padding:16px 18px;border-radius:12px;
    border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);
    text-decoration:none;color:var(--white);transition:border-color .16s,transform .16s,background .16s;}
  .lib-card:hover{border-color:rgba(0,207,230,.7);background:rgba(0,207,230,.08);transform:translateY(-2px);}
  .lib-card.current{border-color:rgba(223,41,255,.7);background:rgba(223,41,255,.10);}
  .lib-badge{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:#9eeaff;background:rgba(0,207,230,.14);border-radius:999px;padding:2px 9px;}
  .lib-name{font-size:14px;font-weight:700;line-height:1.3;}
  .lib-blurb{font-size:12px;color:var(--muted);line-height:1.45;}
  .lib-meta{margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .lib-foot{margin-top:18px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
    font-family:var(--mono);font-size:10.5px;color:var(--muted);}
</style>
</head>
<body class="measure">
  <!-- Layer 1: the reproduction, full-bleed -->
  <div id="viewport">
    <div id="frameWrap"><iframe id="slideFrame" title="slide"></iframe></div>
  </div>

  <!-- Layer 2: measurement border (matches the scaled stage exactly) -->
  <div id="measure">
    <div class="edge t"></div><div class="edge b"></div><div class="edge l"></div><div class="edge r"></div>
    <div class="tick cx"></div><div class="tick cy"></div>
    <div class="dim stage" id="dimStage">stage 1280x720</div>
    <div class="dim safe" id="dimSafe">safe</div>
  </div>

  <button class="navzone left"  id="zoneLeft"  aria-label="Previous slide"></button>
  <button class="navzone right" id="zoneRight" aria-label="Next slide"></button>

  <!-- Layer 3: floating header tilebar (separate layer, nothing else) -->
  <header class="floating-header" id="bar">
    <span class="brand">ClippyFlow</span>
    <span class="page-title" id="deckTitle">ClippySlide default</span>
    <span class="header-stat" id="vpStat">vp</span>
    <button class="header-btn" id="btnPrev" type="button" title="Previous (left arrow)">&lsaquo;</button>
    <span class="header-stat" id="counter">1 / 24</span>
    <button class="header-btn" id="btnNext" type="button" title="Next (right arrow)">&rsaquo;</button>
    <span class="header-sep"></span>
    <button class="header-btn" id="btnMeasure" type="button" title="Toggle measure grid (G)">grid</button>
    <button class="header-btn" id="btnPresent" type="button" title="Present (F)">present</button>
    <button class="header-btn" id="btnLibrary" type="button" title="Deck library (L)">library</button>
  </header>

  <!-- Layer 4: deck library -->
  <div id="library" hidden>
    <div class="lib-panel" role="dialog" aria-label="Deck library" aria-modal="true">
      <div class="lib-head">
        <span class="brand">Library</span>
        <span class="lib-sub" id="libSub">decks</span>
        <button class="header-btn" id="btnLibClose" type="button" aria-label="Close library">close</button>
      </div>
      <div class="lib-grid" id="libGrid"></div>
      <div class="lib-foot">Wiki &amp; decks: <code>https://dayour.github.io/clippyslide/</code></div>
    </div>
  </div>

  <div id="hint">&larr;/&rarr; navigate &middot; F present &middot; L library &middot; H hide bar &middot; G grid</div>

<script>
(function(){
  "use strict";

  /* Mirrors the DECKS registry in generator/build-clippydecks.js. */
  var DECKS = [
    {id:"deck", file:"coe-framework-clippydeck.html", name:"Copilot CoE Framework", theme:"TileSlide", slides:24,
     blurb:"Center of Excellence operating model, from intake and governance through measurement."},
    {id:"brand-deck", file:"clippyflow-brand-clippydeck.html", name:"ClippyFlow Brand Deck", theme:"ClippyFlow", slides:11,
     blurb:"Brand manifesto, spectrum palette, the Nitrous Rule, components, and usage guardrails."},
    {id:"planner-card-math", file:"task-planning-clippydeck.html", name:"Task Planning Flow Architecture", theme:"ClippyFlow", slides:8,
     blurb:"Generic planning paths from intake to an approved plan, with stable tile and card identifiers."},
    {id:"atlassian-connectors", file:"atlassian-connectors-clippydeck.html", name:"Atlassian Connectors", theme:"Pine", slides:7,
     blurb:"Connector landscape and integration patterns for Jira and Confluence."},
    {id:"slides-clippyflow", file:"clippyflow-samples-clippydeck.html", name:"ClippyFlow Sample Slides", theme:"ClippyFlow", slides:3,
     blurb:"Reference ClippyFlow slides: title, orchestration, and the spectrum board."},
    {id:"slides", file:"tileslide-samples-clippydeck.html", name:"TileSlide Sample Slides", theme:"TileSlide", slides:3,
     blurb:"Legacy TileSlide reference slides used as layout examples for new decks."}
  ];
  var DECK_URL = "https://dayour.github.io/clippyslide/decks/";

  var SLIDES = [];
  for (var n = 1; n <= 24; n++){
    SLIDES.push(n === 1 ? "../slides-clippyflow/01-title.html"
                        : n === 7 ? "../slides-clippyflow/07-orchestration.html"
                        : "../deck/" + (n < 10 ? "0"+n : ""+n) + ".html");
  }
  var TOTAL = SLIDES.length, idx = 0;

  var frame   = document.getElementById("slideFrame");
  var counter = document.getElementById("counter");
  var vpStat  = document.getElementById("vpStat");
  var dimStage= document.getElementById("dimStage");
  var dimSafe = document.getElementById("dimSafe");
  var bar     = document.getElementById("bar");
  var btnPrev = document.getElementById("btnPrev");
  var btnNext = document.getElementById("btnNext");

  function fit(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty("--s", s);
    var sw = Math.round(1280 * s), sh = Math.round(720 * s);
    vpStat.textContent = window.innerWidth + "x" + window.innerHeight + " | x" + s.toFixed(3);
    dimStage.textContent = "stage 1280x720 -> " + sw + "x" + sh;
    dimSafe.textContent = "scaled " + sw + "x" + sh + "  (16:9)";
  }

  function show(i){
    idx = Math.max(0, Math.min(TOTAL - 1, i));
    frame.src = SLIDES[idx];
    counter.textContent = (idx + 1) + " / " + TOTAL;
    btnPrev.disabled = (idx === 0);
    btnNext.disabled = (idx === TOTAL - 1);
  }
  function next(){ if (idx < TOTAL - 1) show(idx + 1); }
  function prev(){ if (idx > 0) show(idx - 1); }

  btnPrev.onclick = prev;
  btnNext.onclick = next;
  document.getElementById("zoneLeft").onclick  = prev;
  document.getElementById("zoneRight").onclick = next;

  function toggleFullscreen(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen().catch(function(){});
  }
  document.getElementById("btnPresent").onclick = toggleFullscreen;

  function toggleMeasure(){ document.body.classList.toggle("measure"); }
  document.getElementById("btnMeasure").onclick = toggleMeasure;

  var barHidden = false;
  function setBar(h){ barHidden = h; bar.classList.toggle("hidden", h); }

  // Deck library overlay, rendered from the shared DECKS registry.
  var library = document.getElementById("library");
  (function renderLibrary(){
    var total = 0, html = "";
    for (var i = 0; i < DECKS.length; i++){
      var d = DECKS[i], cur = (d.id === "deck");
      total += d.slides;
      html += '<a class="lib-card' + (cur ? " current" : "") + '" href="' + DECK_URL + d.file + '"'
            + (cur ? ' aria-current="true"' : "") + ">"
            + '<span class="lib-badge">' + d.theme + "</span>"
            + '<span class="lib-name">' + d.name + "</span>"
            + '<span class="lib-blurb">' + d.blurb + "</span>"
            + '<span class="lib-meta">' + d.slides + " slides" + (cur ? " &middot; open" : "") + "</span></a>";
    }
    document.getElementById("libGrid").innerHTML = html;
    document.getElementById("libSub").textContent = DECKS.length + " decks \u00b7 " + total + " slides";
  })();
  function setLibrary(open){ library.hidden = !open; if (open) setBar(false); }
  document.getElementById("btnLibrary").onclick  = function(){ setLibrary(true); };
  document.getElementById("btnLibClose").onclick = function(){ setLibrary(false); };
  library.onclick = function(e){ if (e.target === library) setLibrary(false); };

  document.addEventListener("keydown", function(e){
    if (!library.hidden){
      if (e.key === "Escape"){ e.preventDefault(); setLibrary(false); }
      return;
    }
    switch(e.key){
      case "ArrowRight": case "PageDown": case " ": e.preventDefault(); next(); break;
      case "ArrowLeft":  case "PageUp": e.preventDefault(); prev(); break;
      case "Home": show(0); break;
      case "End": show(TOTAL - 1); break;
      case "l": case "L": e.preventDefault(); setLibrary(true); break;
      case "f": case "F": toggleFullscreen(); break;
      case "g": case "G": toggleMeasure(); break;
      case "h": case "H": setBar(!barHidden); break;
      case "Escape": if (document.fullscreenElement) document.exitFullscreen(); break;
    }
  });

  // Header recedes on idle, returns on mouse move.
  var idleTimer = null;
  function armIdle(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ setBar(true); }, 2800);
  }
  document.addEventListener("mousemove", function(){
    if (barHidden) setBar(false);
    armIdle();
  });

  window.addEventListener("resize", fit);
  fit(); show(0); armIdle();
  setTimeout(function(){ var h=document.getElementById("hint"); if(h) h.style.opacity="0"; }, 4200);
})();
</script>
</body>
</html>
