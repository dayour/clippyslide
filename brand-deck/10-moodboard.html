<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#05080b}</style>
<link rel="stylesheet" href="../design-system/clippyflow.css">
<link rel="stylesheet" href="../design-system/clippyflow-terminal.css">
</head><body>
<div class="cf-stage cf-stage--hero cf-scan">
  <div class="cf-win spectrum">
    <div class="cf-win-bar">
      <span class="cf-win-dots"><i></i><i></i><i></i></span>
      <span class="cf-win-title"><b>moodboard</b> ~/brand/feel</span>
      <span class="cf-win-meta"><span>10 / 11</span><span class="on">● live</span></span>
    </div>
    <div class="cf-win-body" style="display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px">
      <!-- wordmark hero -->
      <div class="cf-mood" style="grid-column:span 2;background:linear-gradient(135deg,var(--cf-navy-deep),var(--cf-navy));align-items:center;justify-content:flex-start">
        <div>
          <div class="cf-ml cyan">the brand</div>
          <div class="cf-wordmark" style="font-size:38px;letter-spacing:2px">CLIPPYFLOW</div>
        </div>
      </div>
      <!-- nitrous rim demo -->
      <div class="cf-mood" style="background:var(--cf-navy);align-items:center;justify-content:center">
        <div class="cf-frame"><span class="cf-mk" style="font-size:12px">NITROUS</span></div>
      </div>
      <!-- green swatch -->
      <div class="cf-mood cf-swatch green"><span class="meta"><span class="n">GREEN</span><span class="h">142deg - live</span></span></div>

      <!-- cyan swatch -->
      <div class="cf-mood cf-swatch cyan"><span class="meta"><span class="n">CYAN</span><span class="h">186deg - fill</span></span></div>
      <!-- prompt tile -->
      <div class="cf-mood" style="grid-column:span 2;background:var(--cf-navy-deep);align-items:center">
        <div class="cf-prompt" style="font-size:15px">render --mood "retro-spectrum-glow"<span class="cf-cursor"></span></div>
      </div>
      <!-- magenta swatch -->
      <div class="cf-mood cf-swatch magenta"><span class="meta"><span class="n">MAGENTA</span><span class="h">291deg - spark</span></span></div>

      <!-- type specimen -->
      <div class="cf-mood" style="background:linear-gradient(135deg,var(--cf-navy),hsl(257,30%,12%));align-items:center;justify-content:center">
        <div class="cf-title" style="font-size:48px">Aa</div>
      </div>
      <!-- purple swatch -->
      <div class="cf-mood cf-swatch purple"><span class="meta"><span class="n">PURPLE</span><span class="h">257deg - primary</span></span></div>
      <!-- badge sample -->
      <div class="cf-mood" style="background:var(--cf-navy);align-items:center;justify-content:center">
        <div class="cf-badge"><span class="dot"></span>orchestrator</div>
      </div>
      <!-- health gradient -->
      <div class="cf-mood" style="background:var(--cf-grad-health);align-items:flex-end">
        <span class="meta"><span class="n">SPECTRUM</span><span class="h">full sweep</span></span>
      </div>
    </div>
  </div>
</div>
</body></html>
